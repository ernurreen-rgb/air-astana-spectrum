<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3525" />
  <title>Air Astana Spectrum - QR Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="qr-page">
  <main class="qr-shell">
    <section class="qr-panel" aria-label="QR code for Air Astana Spectrum">
      <p class="qr-kicker">Open on Phone</p>
      <h1 class="qr-title">Air Astana Spectrum</h1>
      <p class="qr-copy">Scan the QR code to open the live prototype.</p>

      <img
        class="qr-image"
        src="assets/air-astana-spectrum-qr.svg"
        alt="QR code linking to https://air-astana-spectrum.vercel.app/"
      />

      <a class="qr-link" href="https://air-astana-spectrum.vercel.app/">
        https://air-astana-spectrum.vercel.app/
      </a>

      <a class="qr-open-btn" href="index.html">Open local prototype</a>
    </section>
  </main>
</body>
</html>
